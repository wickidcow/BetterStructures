name: Milestone Actions History Cleanup

on:
  push:
    paths:
      - ".github/workflows/actions-history-cleanup.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Remove tester and non-milestone workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          : > /tmp/release-tags
          : > /tmp/version-tags
          : > /tmp/all-tags
          : > /tmp/keep-tags
          : > /tmp/keep-shas

          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' \
            > /tmp/release-tags || true

          gh api --paginate "repos/$REPO/tags?per_page=100" \
            --jq '.[] | [.name, .commit.sha] | @tsv' \
            > /tmp/all-tags || true

          awk -F '\t' '$1 ~ /^v?[0-9]+([.][0-9A-Za-z]+)*([_-][0-9A-Za-z.-]+)?$/ { print $1 }' \
            /tmp/all-tags > /tmp/version-tags || true

          cat /tmp/release-tags /tmp/version-tags | sed '/^$/d' | sort -u > /tmp/keep-tags

          awk -F '\t' 'NR==FNR { keep[$1]=1; next } ($1 in keep) { print $2 }' \
            /tmp/keep-tags /tmp/all-tags | sed '/^$/d' | sort -u > /tmp/keep-shas

          is_tester_name() {
            local name="$1"
            printf '%s\n' "$name" | grep -Eiq \
              'test|smoke|compat|validat|verif|audit|check|doctor|runtime|regression|lint|benchmark|coverage|matrix|compile|cleanup|clean[[:space:]_-]*asset|(^|[^a-z])ci([^a-z]|$)'
          }

          is_milestone_name() {
            local name="$1"
            printf '%s\n' "$name" | grep -Eiq \
              'release|publish|version|milestone|build|bundle|package'
          }

          is_milestone() {
            local status="$1"
            local conclusion="$2"
            local event="$3"
            local branch="$4"
            local sha="$5"
            local name="$6"

            [[ "$status" == "completed" && "$conclusion" == "success" ]] || return 1
            is_tester_name "$name" && return 1

            if [[ "$event" == "release" ]]; then
              return 0
            fi

            local tagged=false
            if [[ -n "$branch" ]] && grep -Fxq -- "$branch" /tmp/keep-tags; then
              tagged=true
            fi
            if [[ -n "$sha" ]] && grep -Fxq -- "$sha" /tmp/keep-shas; then
              tagged=true
            fi

            [[ "$tagged" == "true" ]] || return 1
            is_milestone_name "$name"
          }

          list_runs() {
            gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .status, (.conclusion // ""), .event, (.head_branch // ""), (.head_sha // ""), (.name // "")] | @tsv'
          }

          echo "Keeping only successful build/release/version/publish milestones tied to published releases or version tags."
          echo "Release/version tags found: $(wc -l < /tmp/keep-tags | tr -d ' ')"

          while IFS=$'\t' read -r id status conclusion event branch sha name; do
            [[ -z "$id" ]] && continue
            [[ "$id" == "$CURRENT_RUN_ID" ]] && continue
            if is_milestone "$status" "$conclusion" "$event" "$branch" "$sha" "$name"; then
              continue
            fi
            if [[ "$status" != "completed" ]]; then
              echo "Cancelling non-milestone run $id: $name"
              gh api --method POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 \
                || gh api --method POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 \
                || true
            fi
          done < <(list_runs)

          sleep 15

          deleted=0
          kept=0
          failed=0

          while IFS=$'\t' read -r id status conclusion event branch sha name; do
            [[ -z "$id" ]] && continue
            if [[ "$id" == "$CURRENT_RUN_ID" ]]; then
              kept=$((kept + 1))
              continue
            fi
            if is_milestone "$status" "$conclusion" "$event" "$branch" "$sha" "$name"; then
              echo "Keeping milestone run $id: $name"
              kept=$((kept + 1))
              continue
            fi

            if gh api --method DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1; then
              echo "Deleted run $id: $name"
              deleted=$((deleted + 1))
            else
              echo "Could not delete run $id yet: $name (status=$status)"
              failed=$((failed + 1))
            fi
          done < <(list_runs)

          echo "Cleanup complete: deleted=$deleted kept=$kept failed=$failed"
