name: BetterStructures Albion CI

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: betterstructures-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: FAWE-native block-write audit
        shell: bash
        run: |
          set -euo pipefail
          MATCHES="$(grep -RInE '\.(setType|setBlockData)\(|setBlockInNativeDataPalette\(' src/main/java || true)"
          if [[ -n "$MATCHES" ]]; then
            echo "Direct Bukkit/NMS block writes remain; Albion 1.1.1 must route block changes through FAWE:"
            echo "$MATCHES"
            exit 1
          fi
          echo "FAWE-native audit passed: no direct Bukkit/NMS block writes found."

      - name: Build and test
        run: ./gradlew clean test shadowJar

      - name: Verify versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^version = '\([^']*\)'.*/\1/p" build.gradle)"
          JAR="build/libs/BetterStructures-${VERSION}.jar"
          test -f "$JAR"
          echo "Built $JAR"
          echo "BS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BS_JAR=$JAR" >> "$GITHUB_ENV"

      # This makes the JAR visible in the workflow run's Artifacts section.
      # GitHub Actions artifact downloads are always wrapped by GitHub as a ZIP,
      # so the raw, unzipped JAR is also published below as a release asset.
      - name: Upload JAR to workflow artifacts
        id: upload-jar
        uses: actions/upload-artifact@v4
        with:
          name: BetterStructures-${{ env.BS_VERSION }}.jar
          path: ${{ env.BS_JAR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish raw branch-test JAR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$BS_VERSION"
          JAR="$BS_JAR"
          TAG="albion-${VERSION}-test"
          test -f "$JAR"

          # The test release is intentionally reusable. Move its tag to the exact
          # commit that just passed audit/build/tests before replacing the raw JAR.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" \
              --title "BetterStructures Albion ${VERSION} Test Build" \
              --notes "AlbionMC development test build from commit ${GITHUB_SHA}. This is a prerelease for resource-world runtime testing before the final v${VERSION} release." \
              --prerelease
          else
            gh release create "$TAG" "$JAR" \
              --title "BetterStructures Albion ${VERSION} Test Build" \
              --notes "AlbionMC development test build from commit ${GITHUB_SHA}. This is a prerelease for resource-world runtime testing before the final v${VERSION} release." \
              --prerelease
          fi

      - name: Add JAR links to workflow summary
        if: always() && env.BS_VERSION != ''
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload-jar.outputs.artifact-url }}
        run: |
          {
            echo "## BetterStructures ${BS_VERSION}"
            echo
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "- [Workflow artifact: BetterStructures-${BS_VERSION}.jar](${ARTIFACT_URL})"
            fi
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/heads/agent/* ]]; then
              echo "- [Direct raw JAR: BetterStructures-${BS_VERSION}.jar](https://github.com/${GITHUB_REPOSITORY}/releases/download/albion-${BS_VERSION}-test/BetterStructures-${BS_VERSION}.jar)"
            fi
            echo
            echo "The workflow artifact is shown in GitHub Actions; the release link is the raw .jar with no ZIP wrapper."
          } >> "$GITHUB_STEP_SUMMARY"
