name: BetterStructures Albion CI

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: betterstructures-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: FAWE-native block-write audit
        shell: bash
        run: |
          set -euo pipefail
          MATCHES="$(grep -RInE '\.(setType|setBlockData)\(|setBlockInNativeDataPalette\(' src/main/java || true)"
          if [[ -n "$MATCHES" ]]; then
            echo "Direct Bukkit/NMS block writes remain; Albion 1.1.1 must route block changes through FAWE:"
            echo "$MATCHES"
            exit 1
          fi
          echo "FAWE-native audit passed: no direct Bukkit/NMS block writes found."

      - name: Build and test
        run: ./gradlew clean test shadowJar

      - name: Verify versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^version = '\([^']*\)'.*/\1/p" build.gradle)"
          JAR="build/libs/BetterStructures-${VERSION}.jar"
          test -f "$JAR"
          SHA256="$(sha256sum "$JAR" | awk '{print $1}')"
          echo "Built $JAR"
          echo "SHA-256: $SHA256"
          echo "BS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BS_JAR=$JAR" >> "$GITHUB_ENV"
          echo "BS_SHA256=$SHA256" >> "$GITHUB_ENV"

      # GitHub's Actions artifact system displays the build on the workflow run.
      # GitHub wraps artifact downloads in a ZIP; the raw JAR is also published
      # automatically as the milestone prerelease asset below.
      - name: Upload JAR to workflow artifacts
        id: upload-jar
        uses: actions/upload-artifact@v4
        with:
          name: BetterStructures-${{ env.BS_VERSION }}.jar
          path: ${{ env.BS_JAR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish milestone prerelease and raw JAR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$BS_VERSION"
          JAR="$BS_JAR"
          TAG="albion-${VERSION}-test"
          NOTES="release-notes-${VERSION}.md"
          test -f "$JAR"

          PREVIOUS_SHA=""
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            PREVIOUS_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          fi

          {
            echo "## BetterStructures Albion ${VERSION} — Milestone Build"
            echo
            echo "AlbionMC development build from commit \`${GITHUB_SHA}\`."
            echo
            echo "- **JAR:** \`BetterStructures-${VERSION}.jar\`"
            echo "- **SHA-256:** \`${BS_SHA256}\`"
            echo "- **CI:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- **Runtime target:** Paper 1.21.11+ with FastAsyncWorldEdit"
            echo
            echo "### Changes in this milestone build"
            if [[ -n "$PREVIOUS_SHA" && "$PREVIOUS_SHA" != "$GITHUB_SHA" ]]; then
              git log --no-merges --max-count=25 --pretty='- %s (`%h`)' "${PREVIOUS_SHA}..${GITHUB_SHA}"
            else
              git log --no-merges --max-count=25 --pretty='- %s (`%h`)' "origin/master..${GITHUB_SHA}"
            fi
            echo
            echo "This is an automatically maintained prerelease for AlbionMC runtime testing. After successful live testing, the same version can be promoted to the final \`v${VERSION}\` release."
          } > "$NOTES"

          # Keep the reusable milestone tag on the exact commit that passed the
          # audit, tests and JAR verification before publishing the asset.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" \
              --title "BetterStructures Albion ${VERSION} Milestone Build" \
              --notes-file "$NOTES" \
              --prerelease
          else
            gh release create "$TAG" "$JAR" \
              --title "BetterStructures Albion ${VERSION} Milestone Build" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Add JAR links to workflow summary
        if: always() && env.BS_VERSION != ''
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload-jar.outputs.artifact-url }}
        run: |
          {
            echo "## BetterStructures ${BS_VERSION}"
            echo
            echo "**SHA-256:** \`${BS_SHA256}\`"
            echo
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "- [Actions build artifact: BetterStructures-${BS_VERSION}.jar](${ARTIFACT_URL})"
            fi
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/heads/agent/* ]]; then
              echo "- [Direct raw JAR: BetterStructures-${BS_VERSION}.jar](https://github.com/${GITHUB_REPOSITORY}/releases/download/albion-${BS_VERSION}-test/BetterStructures-${BS_VERSION}.jar)"
              echo "- [Milestone release notes](https://github.com/${GITHUB_REPOSITORY}/releases/tag/albion-${BS_VERSION}-test)"
            fi
            echo
            echo "The Actions artifact is visible on this run. For server use, the milestone release link provides the raw .jar with no ZIP wrapper."
          } >> "$GITHUB_STEP_SUMMARY"
