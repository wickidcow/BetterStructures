# BetterStructures Albion fork CI
# Paper 26.2 is the primary API/runtime target. Purpur and other Paper-compatible
# forks consume the same plugin JAR.

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# BetterStructures 2.6.3 currently uses MagmaCore APIs newer than the stale
# 2.2.0-SNAPSHOT available from the public MagmaGuy Maven repository. Pin the
# source revision used by CI so builds are reproducible rather than depending on
# whichever snapshot happens to be served at build time.
env:
  MAGMACORE_REF: d80637de6fcb0f228fc2142c442d1de81ffad8ee

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out BetterStructures
        uses: actions/checkout@v7

      - name: Check out pinned MagmaCore
        uses: actions/checkout@v7
        with:
          repository: MagmaGuy/MagmaCore
          ref: ${{ env.MAGMACORE_REF }}
          path: .dependencies/MagmaCore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # MagmaCore's current build targets Java 21. Build its complete shaded
      # distribution and publish it to Maven Local under the same
      # com.magmaguy:MagmaCore:2.2.0-SNAPSHOT coordinates BetterStructures uses.
      - name: Set up JDK 21 for MagmaCore
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build pinned MagmaCore dependency
        run: |
          chmod +x .dependencies/MagmaCore/gradlew
          .dependencies/MagmaCore/gradlew -p .dependencies/MagmaCore :dist:publishToMavenLocal --no-daemon

      # Paper 26.2 is a Java 25 server/API target for this fork.
      - name: Set up JDK 25 for BetterStructures
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build BetterStructures
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --refresh-dependencies

      - name: Verify distributable JAR
        run: |
          test -f build/libs/BetterStructures.jar
          ls -lh build/libs/BetterStructures.jar
