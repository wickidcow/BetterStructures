# BetterStructures Albion fork CI
# Paper 26.2 is the primary API/runtime target. Purpur and other Paper-compatible
# forks consume the same plugin JAR.

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Pin source-only dependencies so CI remains reproducible while their public
# snapshot/release repositories catch up with Paper 26.2.
env:
  MAGMACORE_REF: d80637de6fcb0f228fc2142c442d1de81ffad8ee
  MOCKBUKKIT_REF: 55ceb39635aa2347ca55e4246b1df60ef0f6520b

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out BetterStructures
        uses: actions/checkout@v7

      - name: Check out pinned MagmaCore
        uses: actions/checkout@v7
        with:
          repository: MagmaGuy/MagmaCore
          ref: ${{ env.MAGMACORE_REF }}
          path: .dependencies/MagmaCore

      - name: Check out pinned MockBukkit 26.2
        uses: actions/checkout@v7
        with:
          repository: MockBukkit/MockBukkit
          ref: ${{ env.MOCKBUKKIT_REF }}
          path: .dependencies/MockBukkit

      # MagmaCore declares Gradle 9.0.0, but its repository does not commit the
      # gradle-wrapper.jar. Install that exact Gradle version explicitly instead
      # of relying on its incomplete wrapper checkout.
      - name: Set up Gradle 9.0.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.0.0'

      # BetterStructures only needs MagmaCore's shared/core API. Building the
      # full MagmaCore distribution would also compile version-specific NMS
      # projects which depend on local Spigot server artifacts and are not used
      # by BetterStructures.
      - name: Set up JDK 21 for MagmaCore core
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build pinned MagmaCore core dependency
        run: gradle -p .dependencies/MagmaCore :core:publishToMavenLocal --no-daemon

      # Paper 26.2, MockBukkit 26.2, and this BetterStructures fork target Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # Maven Central currently trails MockBukkit's official 26.2 branch. Build
      # the exact upstream commit locally so the tests use Paper 26.2 registry
      # data rather than booting a 1.21/26.1 mock against the 26.2 API.
      - name: Build pinned MockBukkit 26.2 test runtime
        run: |
          chmod +x .dependencies/MockBukkit/gradlew
          cd .dependencies/MockBukkit
          ./gradlew :publishToMavenLocal -x test --no-daemon

      - name: Make BetterStructures wrapper executable
        run: chmod +x gradlew

      - name: Compile BetterStructures
        run: ./gradlew clean compileJava --no-daemon

      - name: Run BetterStructures tests
        run: ./gradlew test --no-daemon

      - name: Build shaded BetterStructures JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Verify distributable JAR
        run: |
          test -f build/libs/BetterStructures.jar
          ls -lh build/libs/BetterStructures.jar
