# BetterStructures Albion fork CI
# Paper 26.2 is the primary API/runtime target. Purpur and other Paper-compatible
# forks consume the same plugin JAR.

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: betterstructures-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pin the MagmaCore revision that contains the BetterStructures 2.7.0
  # Nightbreak/content lifecycle APIs, while publishing only its core module.
  MAGMACORE_REF: 27ce503321359f158fb4874752378ea2e4d629df
  MOCKBUKKIT_REF: 55ceb39635aa2347ca55e4246b1df60ef0f6520b

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out BetterStructures
        uses: actions/checkout@v7

      - name: Check out pinned MagmaCore
        uses: actions/checkout@v7
        with:
          repository: MagmaGuy/MagmaCore
          ref: ${{ env.MAGMACORE_REF }}
          path: .dependencies/MagmaCore

      - name: Check out pinned MockBukkit 26.2
        uses: actions/checkout@v7
        with:
          repository: MockBukkit/MockBukkit
          ref: ${{ env.MOCKBUKKIT_REF }}
          path: .dependencies/MockBukkit

      - name: Set up JDK 21 for MagmaCore
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.0 for MagmaCore
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.0.0'

      - name: Publish pinned MagmaCore core to Maven Local
        run: gradle -p .dependencies/MagmaCore :core:publishToMavenLocal --no-daemon

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Build pinned MockBukkit 26.2 test runtime
        run: gradle -p .dependencies/MockBukkit :publishToMavenLocal -x test --no-daemon

      - name: Compile BetterStructures
        run: gradle clean compileJava --no-daemon

      - name: Run BetterStructures tests
        run: gradle test --no-daemon

      - name: Build shaded BetterStructures JAR
        run: gradle shadowJar --no-daemon

      - name: Prepare raw Albion JAR
        run: |
          test -f build/libs/BetterStructures.jar
          cp build/libs/BetterStructures.jar build/libs/BetterStructures-2.7.0-Albion.jar
          ls -lh build/libs/BetterStructures.jar build/libs/BetterStructures-2.7.0-Albion.jar

      - name: Publish raw JAR release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="betterstructures-2.7.0-albion-build-${GITHUB_RUN_NUMBER}"
          TITLE="BetterStructures 2.7.0 Albion build ${GITHUB_RUN_NUMBER}"
          JAR="build/libs/BetterStructures-2.7.0-Albion.jar"

          RELEASE_FLAGS=(--target "$GITHUB_SHA" --title "$TITLE" --generate-notes)
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            RELEASE_FLAGS+=(--latest)
          else
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi

          gh release create "$TAG" "$JAR" "${RELEASE_FLAGS[@]}"

      - name: Add raw JAR download to Actions summary
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        shell: bash
        run: |
          TAG="betterstructures-2.7.0-albion-build-${GITHUB_RUN_NUMBER}"
          JAR_NAME="BetterStructures-2.7.0-Albion.jar"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${JAR_NAME}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          {
            echo "# 🏰 BetterStructures Raw JAR"
            echo
            echo "✅ Build, tests, and packaging completed successfully."
            echo
            echo "## ⬇️ Direct download"
            echo "[**Download ${JAR_NAME}**](${DOWNLOAD_URL})"
            echo
            echo "This link downloads the actual **.jar** file directly — no .zip extraction required."
            echo
            echo "[View GitHub Release](${RELEASE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
