plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id "com.gradleup.shadow" version "9.6.1"
}

group = 'com.magmaguy'
version = '2.7.0'

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://repo.magmaguy.com/releases' }
    maven { url = "https://repo.magmaguy.com/snapshots" }
    maven { url = 'https://repo.codemc.org/repository/maven-public' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://nexus.phoenixdevt.fr/repository/maven-public/' }
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
}

dependencies {
    // Current Lombok includes JDK 25 support needed by this Paper 26.2 build.
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    compileOnly 'org.projectlombok:lombok:1.18.46'

    // The Paper-focused fork uses MagmaCore's shared core APIs only. Modular
    // structure placement is handled through WorldEdit/FAWE, so the upstream
    // EasyMinecraftGoals/NMS adapter distribution is intentionally not shaded.
    implementation (group: 'com.magmaguy', name: 'core', version: '2.2.0-SNAPSHOT') {
        changing = true
    }
    implementation group: 'org.bstats', name: 'bstats-bukkit', version: '2.2.1'
    implementation group: 'org.joml', name: 'joml', version: '1.10.8'
    compileOnly group: 'com.magmaguy', name: 'EliteMobs', version: '9.3.3-SNAPSHOT'
    compileOnly group: 'io.lumine', name: 'Mythic-Dist', version: '5.2.1'
    compileOnly group: 'io.lumine', name: 'MythicLib-dist', version: '1.5.2-SNAPSHOT'
    compileOnly group: 'net.Indyuce', name: 'MMOItems-API', version: '6.9.2-SNAPSHOT'
    compileOnly group: 'com.sk89q.worldguard', name: 'worldguard-bukkit', version: '7.0.7'
    compileOnly group: 'com.sk89q.worldedit', name: 'worldedit-bukkit', version: '7.3.0'

    // Paper is the compile/runtime API target. Purpur and conventional
    // Paper-compatible forks consume the same API surface.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'

    // Used by upstream 2.7.0 to collapse noisy per-block data-conversion logs.
    compileOnly 'org.apache.logging.log4j:log4j-core:2.24.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.+'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v26.2:dev-55ceb39'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation group: 'com.sk89q.worldedit', name: 'worldedit-bukkit', version: '7.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

artifacts {
    archives shadowJar
}

jar {
    archiveClassifier.set('min')
}

String packagePath = 'com.magmaguy.shaded'

shadowJar {
    dependencies {
        relocate('org.bstats', packagePath + '.bstats')
    }
    // Isolate MagmaCore's static state per shaded plugin so config and lifecycle
    // state cannot collide with other MagmaGuy plugins on the same server.
    relocate 'com.magmaguy.magmacore', 'com.magmaguy.betterstructures.magmacore'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set(null)
    archiveFileName.set(project.name + ".jar")
}

def mcDistDir = System.getenv('MC_DIST_DIR') ?: project.findProperty('mcDistDir')
if (mcDistDir) {
    tasks.register('mirrorToDist', Copy) {
        from tasks.named('shadowJar')
        into mcDistDir
    }
    tasks.named('shadowJar') { finalizedBy('mirrorToDist') }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
}

ext {
    resourceTokens = [
            'Version': version
    ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

processResources {
    filter org.apache.tools.ant.filters.ReplaceTokens, tokens: resourceTokens
}

publishing {
    repositories {
        maven {
            name = "BetterStructures"
            url = "https://repo.magmaguy.com/releases"
            credentials {
                username = project.hasProperty('ossrhUsername') ? ossrhUsername : "Unknown user"
                password = project.hasProperty('ossrhPassword') ? ossrhPassword : "Unknown password"
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            pom {
                groupId = 'com.magmaguy'
                name = 'betterstructures'
                description = 'BetterStructures repo'
                url = 'https://magmaguy.com/'
                from components.java
                licenses {
                    license {
                        name = 'GPLV3'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                    }
                }
            }
        }
    }
}
