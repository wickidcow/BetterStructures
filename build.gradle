plugins {
    id 'java-library'
    id 'idea'
    id "com.gradleup.shadow" version "9.0.0-beta12"
}

group = 'com.magmaguy'
version = '1.1.0'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven { url = 'https://repo.magmaguy.com/releases' }
    maven { url = "https://repo.magmaguy.com/snapshots" }
    maven { url = 'https://repo.codemc.org/repository/maven-public' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://nexus.phoenixdevt.fr/repository/maven-public/' }
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.30'

    implementation (group: 'com.magmaguy', name: 'MagmaCore', version: '2.2.0-SNAPSHOT') {
        changing = true
    }
    implementation group: 'org.bstats', name: 'bstats-bukkit', version: '2.2.1'
    implementation group: 'org.joml', name: 'joml', version: '1.10.8'

    // Albion fork runtime baseline: Paper 1.21.11+ with FastAsyncWorldEdit.
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.14.3'

    compileOnly group: 'com.magmaguy', name: 'EliteMobs', version: '9.3.3-SNAPSHOT'
    compileOnly group: 'io.lumine', name: 'Mythic-Dist', version: '5.2.1'
    compileOnly group: 'io.lumine', name: 'MythicLib-dist', version: '1.5.2-SNAPSHOT'
    compileOnly group: 'net.Indyuce', name: 'MMOItems-API', version: '6.9.2-SNAPSHOT'
    compileOnly group: 'com.sk89q.worldguard', name: 'worldguard-bukkit', version: '7.0.7'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.110.0'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    // Tests exercise FAWE-specific clipboard/runtime code, so use the same provider
    // BetterStructures requires in production instead of a separate WorldEdit runtime.
    testImplementation 'com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.14.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

artifacts {
    archives shadowJar
}

jar {
    archiveClassifier.set('min')
}

String packagePath = 'com.magmaguy.shaded'

shadowJar {
    dependencies {
        relocate('org.bstats', packagePath + '.bstats')
    }
    relocate 'com.magmaguy.easyminecraftgoals', 'com.magmaguy.betterstructures.easyminecraftgoals'
    relocate 'com.magmaguy.magmacore', 'com.magmaguy.betterstructures.magmacore'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set(null)
    archiveFileName.set("BetterStructures-${project.version}.jar")
}

def mcDistDir = System.getenv('MC_DIST_DIR') ?: project.findProperty('mcDistDir')
if (mcDistDir) {
    tasks.register('mirrorToDist', Copy) {
        from tasks.named('shadowJar')
        into mcDistDir
    }
    tasks.named('shadowJar') { finalizedBy('mirrorToDist') }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

ext {
    resourceTokens = [
            'Version': version
    ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

processResources {
    filter org.apache.tools.ant.filters.ReplaceTokens, tokens: resourceTokens
}
